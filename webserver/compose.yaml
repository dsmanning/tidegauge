services:
  tidegauge:
    build: .
    container_name: tidegauge
    restart: unless-stopped
    env_file: .env
    ports:
      # Bind only on the host; the existing reverse proxy should target this.
      - "127.0.0.1:3000:3000"
    volumes:
      - tidegauge-data:/data
      # Uncomment when MQTT_CA_FILE points into /certs.
      # - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tidegauge-data:
