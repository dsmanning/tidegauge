server {
    listen 80;
    listen [::]:80;
    server_name tidegauge.dsmanning.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "tidegauge.dsmanning.com setup in progress\n";
        add_header Content-Type text/plain;
    }
}
